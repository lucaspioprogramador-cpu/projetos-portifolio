name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check core/risk.py core/execution.py core/simulator.py core/data.py backtest/runner.py backtest/metrics.py strategies/features.py strategies/ai_strategy_melhorada.py exchanges/binance.py exchanges/mock.py tests
      - run: python -m pytest -q
